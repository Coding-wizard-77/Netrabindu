version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: netrabindu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netrabindu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netrabindu_secret}
      POSTGRES_DB: ${POSTGRES_DB:-netrabindu}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netrabindu -d netrabindu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netrabindu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    container_name: netrabindu-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:29092
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: netrabindu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: netrabindu-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP & API
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC WHEP
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: netrabindu-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://netrabindu:netrabindu_secret@postgres:5432/netrabindu
      SYNC_DATABASE_URL: postgresql+psycopg2://netrabindu:netrabindu_secret@postgres:5432/netrabindu
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MEDIAMTX_API_URL: http://mediamtx:8554
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      MEDIAMTX_WEBRTC_URL: http://mediamtx:8889
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      OBJECT_STORE_ENDPOINT: http://minio:9000
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-in-production-min-32-chars-long}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netrabindu-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ai_engine:
    build:
      context: .
      dockerfile: ai_models/Dockerfile
    container_name: netrabindu-ai-engine
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000/api
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EDGE_NODE_ID: edge-sentinel-sg-01
      EDGE_REGION: "S.G. Highway Command, Ahmedabad"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: netrabindu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: netrabindu-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
