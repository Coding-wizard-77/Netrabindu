events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream api_server {
        server api:8000;
    }

    upstream mediamtx_webrtc {
        server mediamtx:8889;
    }

    server {
        listen 80;
        server_name localhost;

        # API & WebSocket
        location /api/ {
            proxy_pass http://api_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://api_server/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # MediaMTX WebRTC signaling
        location /webrtc/ {
            proxy_pass http://mediamtx_webrtc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Swagger Docs
        location /docs {
            proxy_pass http://api_server/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_server/openapi.json;
        }

        # Web Command Center static files (Engineer 3)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
